name: Sync KBO Rosters

# 스케줄 비활성화(2026-07-27): KBO 사이트가 GitHub Actions의 해외(미국) IP를
# 차단·리셋해서 매번 실패함. 로스터 갱신은 한국 IP인 로컬 PC의 작업 스케줄러가
# 담당(npm run scrape:rosters). 필요 시 아래 수동 트리거로만 실행.
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit + push 권한 (data/rosters/*.json 갱신)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run KBO roster scraper
        run: npm run scrape:rosters

      - name: Commit if rosters changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain data/rosters/) ]]; then
            git add data/rosters/
            git commit -m "chore: weekly KBO roster sync ($(date -u +%Y-%m-%d))"
            git push
            echo "Roster changes committed."
          else
            echo "No roster changes — skipping commit."
          fi
