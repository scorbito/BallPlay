name: Curate YouTube Videos

# Runs daily at 04:10 KST (= 19:10 UTC, previous day) plus manual dispatch.
# The bot collects popular baseball videos from YouTube and inserts them into bp_videos.
on:
  schedule:
    - cron: '10 19 * * *'
  workflow_dispatch:

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node.js 22+ includes the native WebSocket used by supabase-js.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run YouTube curation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BALLPLAY_BOT_USER_ID: ${{ secrets.BALLPLAY_BOT_USER_ID }}
        run: npm run curate:youtube
